<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@CaptainDeSolOfficial | TikTok Explorer Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Profile Header -->
  <section class="profile">
    <img src="images/captain.jpg" alt="Captain Rafael de Sol" class="pfp">
    <div class="profile-details">
      <h2>@CaptainDeSolOfficial</h2>
      <button class="follow-btn">Follow</button>
	<button class="msg-btn">Message</button>
      <div class="stats">
        <div><strong>102</strong><span>Following</span></div>
        <div><strong>20.3K</strong><span>Followers</span></div>
        <div><strong>85.4K</strong><span>Likes</span></div>
      </div>
      <p class="bio">🌊 Explorer for Spain | Founder of Isla de Solara (1521) 🇪🇸<br>
      “Serve God, serve the Crown, and gain riches.”</p>
    </div>
  </section>

  <!-- Tabs (Posts, Reposts, Likes, etc.) -->
  <nav class="tabs">
    <button class="active">Posts</button>
    <button>Reposts</button>
    <button>Likes</button>
    <button>Drafts</button>
    <button>Favorites</button>
  </nav>

  <!-- Posts Grid -->
  <section class="posts">
    <div class="post" data-caption="Post 1: The Journey Begins 🌊🇪🇸 — Leaving Seville with 3 ships and 80 men in search of gold, glory, and God. #Voyage #ColumbianExchange">
      <img src="images/post1.jpg" alt="Voyage Begins">
    </div>

    <div class="post" data-caption="Post 2: After 3 Months at Sea 😭🌴 — We found land! I name it Isla de Solara — 'Island of Sunlight.' #NewWorld #Discovery">
      <img src="images/post2.jpg" alt="Land Discovered">
    </div>

    <div class="post" data-caption="Post 3: Meeting the Locals 👀🪶 — The Lumaran are peaceful traders; they exchange pearls for mirrors. #CulturalExchange">
      <img src="images/post3.jpg" alt="Meeting the Locals">
    </div>

    <div class="post" data-caption="Post 4: Bro... GOLD in the RIVERS 😭🔥 — Gold flakes in rivers, silver in hills, coconuts everywhere. Spain wins. #GoldRush #Resources">
      <img src="images/post4.jpg" alt="Resources Found">
    </div>

    <div class="post" data-caption="Post 5: Farms = Fortune 🌱 — Sugarcane and rice farms built with local help under the encomienda system. #ColonialEconomy">
      <img src="images/post5.jpg" alt="Farming System">
    </div>

    <div class="post" data-caption="Post 6: The Great Battle for Solara ⚔️ — Chief Lumaran resisted; we had cannons. Treaty signed, Solara now Spanish territory. #Conquest">
      <img src="images/post6.jpg" alt="Battle for Solara">
    </div>

    <div class="post" data-caption="Post 7: Why You Should Move Here 😍⛵️ — Warm weather, gold, beaches, and faith. Come to paradise! #JoinTheVoyage #ColonizerTok">
      <img src="images/post7.jpg" alt="Why Move to Solara">
    </div>
  </section>

  <!-- Popup Modal for Clicked Posts -->
  <div id="postModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <img id="modalImg" src="" alt="">
      <p id="modalCaption"></p>
    </div>
  </div>

  <footer>
    <p>About | Terms of Exploration | Privacy of the Crown | Contact: King Ferdinand 👑</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
